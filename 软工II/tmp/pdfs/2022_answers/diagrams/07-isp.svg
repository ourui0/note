 <rect class="note" x="390" y="970" width="1020" height="70"/><text class="t" x="900" y="1015" text-anchor="middle">原 Payment 把三种无关操作放在同一接口，迫使实现类依赖不用的方法，违反 ISP，并削弱单一职责。</text></svg>