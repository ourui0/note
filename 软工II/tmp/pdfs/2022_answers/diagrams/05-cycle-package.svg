</defs><rect width="1800" height="1100" fill="#f4f7fc"/><rect width="1800" height="16" fill="#5b3f91"/><text class="title" x="65" y="70">第 6 题答案：消除用户包与优惠券包的循环依赖</text><text class="s" x="65" y="106" fill="#52627a">把发券用例编排移入 application 包，并抽取稳定的用户接口</text>
