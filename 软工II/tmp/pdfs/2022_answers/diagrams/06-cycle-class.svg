</defs><rect width="1800" height="1100" fill="#f4f7fc"/><rect width="1800" height="16" fill="#5b3f91"/><text class="title" x="65" y="70">第 6 题答案：消除循环后的类协作</text><text class="s" x="65" y="106" fill="#52627a">应用服务依赖抽象接口，User 通过实现接口接收 Coupon</text>
 <g><rect class="node" x="100" y="200" width="330" height="190"/><rect class="head" x="100" y="200" width="330" height="55"/><text class="tiny" x="265" y="220" text-anchor="middle">«interface»</text><text class="h" x="265" y="245" text-anchor="middle">CouponRecipient</text><text class="s" x="117" y="290">+ getType(): UserType</text><text class="s" x="117" y="321">+ addCoupon(coupon)</text></g>
 <g><rect class="node" x="100" y="610" width="330" height="190"/><rect class="head" x="100" y="610" width="330" height="55"/><text class="tiny" x="265" y="630" text-anchor="middle"></text><text class="h" x="265" y="655" text-anchor="middle">User</text><text class="s" x="117" y="700">- type: UserType</text><text class="s" x="117" y="731">- coupons: List&lt;Coupon&gt;</text><text class="s" x="117" y="762">+ addCoupon(coupon)</text></g>
 <g><rect class="node" x="610" y="180" width="350" height="180"/><rect class="head" x="610" y="180" width="350" height="55"/><text class="tiny" x="785" y="200" text-anchor="middle"></text><text class="h" x="785" y="225" text-anchor="middle">CouponIssuanceService</text><text class="s" x="627" y="270">- factory: CouponFactory</text><text class="s" x="627" y="301">+ issueCoupon(recipients)</text></g>
 <g><rect class="node" x="610" y="610" width="350" height="160"/><rect class="head" x="610" y="610" width="350" height="55"/><text class="tiny" x="785" y="630" text-anchor="middle"></text><text class="h" x="785" y="655" text-anchor="middle">CouponFactory</text><text class="s" x="627" y="700">+ createFor(type): Coupon</text></g>
 <g><rect class="node" x="1190" y="180" width="330" height="160"/><rect class="head" x="1190" y="180" width="330" height="55"/><text class="tiny" x="1355" y="200" text-anchor="middle">«interface»</text><text class="h" x="1355" y="225" text-anchor="middle">Coupon</text><text class="s" x="1207" y="270">+ calculateDiscount(amount)</text></g>
 <g><rect class="node" x="1080" y="610" width="280" height="140"/><rect class="head" x="1080" y="610" width="280" height="55"/><text class="tiny" x="1220" y="630" text-anchor="middle"></text><text class="h" x="1220" y="655" text-anchor="middle">FiveYuanCoupon</text><text class="s" x="1097" y="700">+ calculateDiscount(amount)</text></g><g><rect class="node" x="1435" y="610" width="280" height="140"/><rect class="head" x="1435" y="610" width="280" height="55"/><text class="tiny" x="1575" y="630" text-anchor="middle"></text><text class="h" x="1575" y="655" text-anchor="middle">TenYuanCoupon</text><text class="s" x="1452" y="700">+ calculateDiscount(amount)</text></g>
