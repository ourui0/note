 <rect class="note" x="300" y="930" width="1200" height="85"/><text class="t" x="900" y="968" text-anchor="middle">短路展开后共有 5 个判定节点，因此 V(G) = 5 + 1 = 6。</text><text class="s" x="900" y="1000" text-anchor="middle">要让后续条件取到假值，前面的 A、B、C 必须先为真。</text></svg>