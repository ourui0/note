<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1950" viewBox="0 0 2300 1950">
  <defs>
    <marker id="depArrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#2e405e" stroke-width="1.8"/>
    </marker>
    <marker id="realizeArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M1,1 L15,8 L1,15 Z" fill="#fff" stroke="#7b3f98" stroke-width="1.8"/>
    </marker>
    <style>
      text { font-family:"PingFang SC","Microsoft YaHei",sans-serif; fill:#172033; }
      .node { fill:#f9fbff; stroke:#24324a; stroke-width:3; rx:12; }
      .pkg { fill:#fff; stroke:#30496e; stroke-width:2.2; rx:5; }
      .pkgTab { fill:#dce8f8; stroke:#30496e; stroke-width:2.2; }
      .domain { fill:#f7faff; stroke:#5f7392; stroke-width:1.8; rx:5; }
      .dep { fill:none; stroke:#2e405e; stroke-width:2.2; stroke-dasharray:9 7; marker-end:url(#depArrow); }
      .realize { fill:none; stroke:#7b3f98; stroke-width:2.4; stroke-dasharray:9 7; marker-end:url(#realizeArrow); }
      .ext { fill:#fff7e8; stroke:#a66313; stroke-width:2.2; rx:8; }
      .db { fill:#eef8ef; stroke:#2f6b3b; stroke-width:2.4; rx:8; }
      .layerTitle { font-size:25px; font-weight:700; text-anchor:middle; }
      .domainText { font-size:18px; font-weight:600; text-anchor:middle; }
      .small { font-size:17px; text-anchor:middle; }
      .relText { font-size:18px; font-weight:600; text-anchor:middle; fill:#34435b; }
    </style>
  </defs>

  <rect width="2300" height="1950" fill="#f3f6fb"/>
  <text x="1150" y="48" font-size="36" font-weight="700" text-anchor="middle">实验设备预约与借用系统——物理包图</text>

  <!-- 物理边界 -->
  <rect class="node" x="70" y="80" width="1860" height="260"/>
  <text x="105" y="118" font-size="24" font-weight="700">«device» 客户端 / Browser</text>

  <rect class="node" x="70" y="390" width="1860" height="1490"/>
  <text x="105" y="430" font-size="24" font-weight="700">«node» 应用服务器 / Server</text>

  <!-- 外部系统 -->
  <rect class="ext" x="2010" y="990" width="250" height="95"/>
  <text x="2135" y="1030" font-size="22" font-weight="700" text-anchor="middle">校园统一支付平台</text>
  <text class="small" x="2135" y="1060">External REST API</text>
  <rect class="ext" x="2010" y="1135" width="250" height="95"/>
  <text x="2135" y="1175" font-size="22" font-weight="700" text-anchor="middle">门禁系统</text>
  <text class="small" x="2135" y="1205">External REST API</text>

  <!-- 依赖关系先画 -->
  <path class="dep" d="M800,300 L800,470"/>
  <text class="relText" x="915" y="385">HTTP + REST API</text>

  <path class="dep" d="M300,650 L300,720"/>
  <text class="relText" x="390" y="692">依赖</text>

  <path class="realize" d="M600,970 L600,900"/>
  <text class="relText" x="690" y="943">实现</text>

  <path class="dep" d="M900,1150 L900,1220"/>
  <text class="relText" x="990" y="1192">依赖</text>

  <path class="realize" d="M600,1470 L600,1400"/>
  <text class="relText" x="690" y="1443">实现</text>

  <path class="dep" d="M800,1650 L800,1740"/>
  <text class="relText" x="900" y="1702">ORM / SQL</text>

  <!-- VO 依赖 -->
  <path class="dep" d="M1480,560 L1570,735"/>
  <path class="dep" d="M1480,805 L1570,800"/>
  <text class="relText" x="1530" y="690">依赖 VO</text>

  <!-- PO 依赖 -->
  <path class="dep" d="M1480,1070 L1570,1240"/>
  <path class="dep" d="M1480,1310 L1570,1310"/>
  <path class="dep" d="M1480,1560 L1570,1390"/>
  <text class="relText" x="1532" y="1190">依赖 PO</text>

  <!-- 外部系统依赖：从 Service Impl 发出 -->
  <path class="dep" d="M1480,1035 L1945,1035 L2010,1035"/>
  <text class="relText" x="1760" y="1020">billing.service.impl</text>
  <path class="dep" d="M1480,1110 L1945,1110 L1945,1180 L2010,1180"/>
  <text class="relText" x="1735" y="1095">checkout / reservation.service.impl</text>

  <!-- 浏览器包 -->
  <rect class="pkg" x="160" y="145" width="1580" height="145"/>
  <rect class="pkgTab" x="160" y="125" width="240" height="42"/>
  <text x="280" y="154" font-size="22" font-weight="700" text-anchor="middle">browser-web</text>
  <rect class="domain" x="250" y="185" width="380" height="70"/><text class="domainText" x="440" y="227">HTML 页面</text>
  <rect class="domain" x="690" y="185" width="380" height="70"/><text class="domainText" x="880" y="227">CSS 样式</text>
  <rect class="domain" x="1130" y="185" width="480" height="70"/><text class="domainText" x="1370" y="215">JavaScript</text><text class="small" x="1370" y="240">调用 REST API</text>

  <!-- 展示层 -->
  <rect class="pkg" x="140" y="470" width="1340" height="180"/>
  <rect class="pkgTab" x="140" y="448" width="360" height="44"/>
  <text x="320" y="478" font-size="22" font-weight="700" text-anchor="middle">展示层 presentation</text>
  <text class="small" x="810" y="505">REST Controller；只依赖 Service Interface，不直接访问 DAO</text>
  <rect class="domain" x="180" y="535" width="240" height="80"/><text class="domainText" x="300" y="566">device</text><text class="small" x="300" y="592">controller</text>
  <rect class="domain" x="435" y="535" width="240" height="80"/><text class="domainText" x="555" y="566">reservation</text><text class="small" x="555" y="592">controller</text>
  <rect class="domain" x="690" y="535" width="240" height="80"/><text class="domainText" x="810" y="566">checkout</text><text class="small" x="810" y="592">controller</text>
  <rect class="domain" x="945" y="535" width="240" height="80"/><text class="domainText" x="1065" y="566">billing</text><text class="small" x="1065" y="592">controller</text>
  <rect class="domain" x="1200" y="535" width="240" height="80"/><text class="domainText" x="1320" y="566">user</text><text class="small" x="1320" y="592">controller</text>

  <!-- Service Interface -->
  <rect class="pkg" x="140" y="720" width="1340" height="180"/>
  <rect class="pkgTab" x="140" y="698" width="400" height="44"/>
  <text x="340" y="728" font-size="22" font-weight="700" text-anchor="middle">业务逻辑层接口 Service Interface</text>
  <text class="small" x="810" y="755">按需求定义供展示层调用的接口；入参和返回值使用 VO</text>
  <rect class="domain" x="180" y="785" width="240" height="80"/><text class="domainText" x="300" y="816">device.service.api</text><text class="small" x="300" y="842">IDeviceService</text>
  <rect class="domain" x="435" y="785" width="240" height="80"/><text class="domainText" x="555" y="816">reservation.service.api</text><text class="small" x="555" y="842">IReservationService</text>
  <rect class="domain" x="690" y="785" width="240" height="80"/><text class="domainText" x="810" y="816">checkout.service.api</text><text class="small" x="810" y="842">ICheckoutService</text>
  <rect class="domain" x="945" y="785" width="240" height="80"/><text class="domainText" x="1065" y="816">billing.service.api</text><text class="small" x="1065" y="842">IBillingService</text>
  <rect class="domain" x="1200" y="785" width="240" height="80"/><text class="domainText" x="1320" y="816">user.service.api</text><text class="small" x="1320" y="842">IUserService</text>

  <!-- Service Impl -->
  <rect class="pkg" x="140" y="970" width="1340" height="180"/>
  <rect class="pkgTab" x="140" y="948" width="400" height="44"/>
  <text x="340" y="978" font-size="22" font-weight="700" text-anchor="middle">业务逻辑层实现 Service Impl</text>
  <text class="small" x="810" y="1005">实现 Service Interface；只通过 DAO Interface 访问数据</text>
  <rect class="domain" x="180" y="1035" width="240" height="80"/><text class="domainText" x="300" y="1066">device.service.impl</text><text class="small" x="300" y="1092">DeviceServiceImpl</text>
  <rect class="domain" x="435" y="1035" width="240" height="80"/><text class="domainText" x="555" y="1066">reservation.service.impl</text><text class="small" x="555" y="1092">ReservationServiceImpl</text>
  <rect class="domain" x="690" y="1035" width="240" height="80"/><text class="domainText" x="810" y="1066">checkout.service.impl</text><text class="small" x="810" y="1092">CheckoutServiceImpl</text>
  <rect class="domain" x="945" y="1035" width="240" height="80"/><text class="domainText" x="1065" y="1066">billing.service.impl</text><text class="small" x="1065" y="1092">BillingServiceImpl</text>
  <rect class="domain" x="1200" y="1035" width="240" height="80"/><text class="domainText" x="1320" y="1066">user.service.impl</text><text class="small" x="1320" y="1092">UserServiceImpl</text>

  <!-- DAO Interface -->
  <rect class="pkg" x="140" y="1220" width="1340" height="180"/>
  <rect class="pkgTab" x="140" y="1198" width="400" height="44"/>
  <text x="340" y="1228" font-size="22" font-weight="700" text-anchor="middle">数据访问层接口 DAO Interface</text>
  <text class="small" x="810" y="1255">定义数据访问契约；面向 PO</text>
  <rect class="domain" x="180" y="1285" width="240" height="80"/><text class="domainText" x="300" y="1316">device.dao.api</text><text class="small" x="300" y="1342">IDeviceDao</text>
  <rect class="domain" x="435" y="1285" width="240" height="80"/><text class="domainText" x="555" y="1316">reservation.dao.api</text><text class="small" x="555" y="1342">IReservationDao</text>
  <rect class="domain" x="690" y="1285" width="240" height="80"/><text class="domainText" x="810" y="1316">checkout.dao.api</text><text class="small" x="810" y="1342">ICheckoutDao</text>
  <rect class="domain" x="945" y="1285" width="240" height="80"/><text class="domainText" x="1065" y="1316">billing.dao.api</text><text class="small" x="1065" y="1342">IBillingDao</text>
  <rect class="domain" x="1200" y="1285" width="240" height="80"/><text class="domainText" x="1320" y="1316">user.dao.api</text><text class="small" x="1320" y="1342">IUserDao</text>

  <!-- DAO Impl -->
  <rect class="pkg" x="140" y="1470" width="1340" height="180"/>
  <rect class="pkgTab" x="140" y="1448" width="400" height="44"/>
  <text x="340" y="1478" font-size="22" font-weight="700" text-anchor="middle">数据访问层实现 DAO Impl</text>
  <text class="small" x="810" y="1505">实现 DAO Interface；负责 ORM 映射和持久化</text>
  <rect class="domain" x="180" y="1535" width="240" height="80"/><text class="domainText" x="300" y="1566">device.dao.impl</text><text class="small" x="300" y="1592">DeviceDaoImpl</text>
  <rect class="domain" x="435" y="1535" width="240" height="80"/><text class="domainText" x="555" y="1566">reservation.dao.impl</text><text class="small" x="555" y="1592">ReservationDaoImpl</text>
  <rect class="domain" x="690" y="1535" width="240" height="80"/><text class="domainText" x="810" y="1566">checkout.dao.impl</text><text class="small" x="810" y="1592">CheckoutDaoImpl</text>
  <rect class="domain" x="945" y="1535" width="240" height="80"/><text class="domainText" x="1065" y="1566">billing.dao.impl</text><text class="small" x="1065" y="1592">BillingDaoImpl</text>
  <rect class="domain" x="1200" y="1535" width="240" height="80"/><text class="domainText" x="1320" y="1566">user.dao.impl</text><text class="small" x="1320" y="1592">UserDaoImpl</text>

  <!-- VO -->
  <rect class="pkg" x="1570" y="680" width="300" height="260"/>
  <rect class="pkgTab" x="1570" y="658" width="130" height="44"/>
  <text x="1635" y="688" font-size="23" font-weight="700" text-anchor="middle">VO</text>
  <text class="small" x="1720" y="735">Value Object</text>
  <text class="small" x="1720" y="780">DeviceVO</text><text class="small" x="1720" y="812">ReservationVO</text>
  <text class="small" x="1720" y="844">CheckoutVO</text><text class="small" x="1720" y="876">BillVO</text>
  <text class="small" x="1720" y="908">UserVO</text>

  <!-- PO -->
  <rect class="pkg" x="1570" y="1160" width="300" height="285"/>
  <rect class="pkgTab" x="1570" y="1138" width="130" height="44"/>
  <text x="1635" y="1168" font-size="23" font-weight="700" text-anchor="middle">PO</text>
  <text class="small" x="1720" y="1212">Persistent Object</text>
  <text class="small" x="1720" y="1255">DevicePO</text><text class="small" x="1720" y="1287">ReservationPO</text>
  <text class="small" x="1720" y="1319">CheckoutPO</text><text class="small" x="1720" y="1351">BillPO</text>
  <text class="small" x="1720" y="1383">UserPO</text><text class="small" x="1720" y="1415">PaymentPO</text>

  <!-- 数据库 -->
  <rect class="db" x="620" y="1740" width="480" height="95"/>
  <text x="860" y="1780" font-size="24" font-weight="700" text-anchor="middle">关系数据库</text>
  <text class="small" x="860" y="1812">设备、预约、借还、账单、用户等表</text>

  <!-- 图例 -->
  <line class="dep" x1="1270" y1="1780" x2="1390" y2="1780"/><text class="small" x="1505" y="1787">依赖（虚线箭头）</text>
  <line class="realize" x1="1270" y1="1830" x2="1390" y2="1830"/><text class="small" x="1515" y="1837">接口实现（虚线空心三角）</text>
  <text x="1150" y="1915" font-size="18" fill="#667085" text-anchor="middle">禁止路径：presentation ⇢ DAO；Service Impl ⇢ DAO Impl；所有数据访问必须经由 DAO Interface</text>
</svg>
