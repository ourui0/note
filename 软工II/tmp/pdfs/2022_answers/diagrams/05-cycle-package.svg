 <g><rect x="485" y="670" width="830" height="250" fill="#fff" stroke="#2f4262" stroke-width="2.5" rx="6"/><rect x="485" y="646" width="300" height="46" fill="#e8eef9" stroke="#2f4262" stroke-width="2.5"/><text class="h" x="635" y="679" text-anchor="middle">coupon.application</text></g><text class="t" x="900" y="770" text-anchor="middle">CouponIssuanceService</text><text class="s" x="900" y="820" text-anchor="middle">只负责编排“查询资格 - 创建优惠券 - 发放”</text>
