  <ellipse cx="550" cy="590" rx="165" ry="48" fill="#fff" stroke="#334b70" stroke-width="2.5"/><text class="t" x="550" y="598" text-anchor="middle">[基础用例]</text><ellipse cx="900" cy="590" rx="170" ry="48" fill="#fff" stroke="#334b70" stroke-width="2.5"/><text class="t" x="900" y="598" text-anchor="middle">[条件扩展用例]</text>
