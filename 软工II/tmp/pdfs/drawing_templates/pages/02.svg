  <g transform="translate(180,360)"><circle cx="0" cy="-35" r="20" fill="none" stroke="#263750" stroke-width="3"/><path d="M0,-15 L0,55 M-38,10 L38,10 M0,55 L-30,98 M0,55 L30,98" fill="none" stroke="#263750" stroke-width="3" stroke-linecap="round"/><text class="h" x="0" y="135" text-anchor="middle">[主要参与者]</text></g><g transform="translate(180,780)"><circle cx="0" cy="-35" r="20" fill="none" stroke="#263750" stroke-width="3"/><path d="M0,-15 L0,55 M-38,10 L38,10 M0,55 L-30,98 M0,55 L30,98" fill="none" stroke="#263750" stroke-width="3" stroke-linecap="round"/><text class="h" x="0" y="135" text-anchor="middle">[次要参与者]</text></g><g transform="translate(1325,560)"><circle cx="0" cy="-35" r="20" fill="none" stroke="#263750" stroke-width="3"/><path d="M0,-15 L0,55 M-38,10 L38,10 M0,55 L-30,98 M0,55 L30,98" fill="none" stroke="#263750" stroke-width="3" stroke-linecap="round"/><text class="h" x="0" y="135" text-anchor="middle">[外部系统]</text></g>
