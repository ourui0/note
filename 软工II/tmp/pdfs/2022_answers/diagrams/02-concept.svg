 <rect class="note" x="415" y="900" width="1010" height="120"/><text class="s" x="445" y="940">关系：学生、教师继承用户；用户与校园卡为强拥有关系；校园卡组合交易明细；充值记录继承交易明细；</text><text class="s" x="445" y="975">用户聚合银行卡；充值记录可关联付款银行卡，并依赖校园卡完成余额更新。</text></svg>