  <marker id="tri" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M1,1 L15,8 L1,15 Z" fill="#fff" stroke="#5b3f91" stroke-width="2"/></marker>
  <style>
   text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:800}.h{font-size:25px;font-weight:700}.t{font-size:21px}.s{font-size:18px}.tiny{font-size:16px}
   .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.node{fill:#fff;stroke:#2f4262;stroke-width:2.5;rx:8}.head{fill:#e8eef9;stroke:#2f4262;stroke-width:2.5}.note{fill:#fff8e8;stroke:#d99622;stroke-width:2;rx:12}
   .line{fill:none;stroke:#24324a;stroke-width:2.5}.call{fill:none;stroke:#24324a;stroke-width:2.5;marker-end:url(#solid)}.ret{fill:none;stroke:#465773;stroke-width:2.2;stroke-dasharray:9 7;marker-end:url(#open)}.dep{fill:none;stroke:#314b70;stroke-width:2.3;stroke-dasharray:9 7;marker-end:url(#open)}.real{fill:none;stroke:#5b3f91;stroke-width:2.3;stroke-dasharray:9 7;marker-end:url(#tri)}.inherit{fill:none;stroke:#5b3f91;stroke-width:2.3;marker-end:url(#tri)}
  </style>
</defs><rect width="1800" height="1100" fill="#f4f7fc"/><rect width="1800" height="16" fill="#5b3f91"/><text class="title" x="65" y="70">第 7 题（1）答案：按接口隔离原则拆分支付接口</text><text class="s" x="65" y="106" fill="#52627a">每个交易类只依赖自己真正使用的付款能力</text>
 <g><rect class="node" x="650" y="140" width="500" height="125"/><rect class="head" x="650" y="140" width="500" height="55"/><text class="tiny" x="900" y="160" text-anchor="middle">«interface»</text><text class="h" x="900" y="185" text-anchor="middle">Transaction</text><text class="s" x="667" y="230">+ execute()</text></g>
 <g><rect class="node" x="120" y="420" width="360" height="135"/><rect class="head" x="120" y="420" width="360" height="55"/><text class="tiny" x="300" y="440" text-anchor="middle"></text><text class="h" x="300" y="465" text-anchor="middle">ElectricTransaction</text><text class="s" x="137" y="510">+ execute()</text></g><g><rect class="node" x="720" y="420" width="360" height="135"/><rect class="head" x="720" y="420" width="360" height="55"/><text class="tiny" x="900" y="440" text-anchor="middle"></text><text class="h" x="900" y="465" text-anchor="middle">WaterTransaction</text><text class="s" x="737" y="510">+ execute()</text></g><g><rect class="node" x="1320" y="420" width="360" height="135"/><rect class="head" x="1320" y="420" width="360" height="55"/><text class="tiny" x="1500" y="440" text-anchor="middle"></text><text class="h" x="1500" y="465" text-anchor="middle">DinnerTransaction</text><text class="s" x="1337" y="510">+ execute()</text></g>
 <g><rect class="node" x="120" y="780" width="360" height="130"/><rect class="head" x="120" y="780" width="360" height="55"/><text class="tiny" x="300" y="800" text-anchor="middle">«interface»</text><text class="h" x="300" y="825" text-anchor="middle">ElectricPayment</text><text class="s" x="137" y="870">+ electricPayment()</text></g><g><rect class="node" x="720" y="780" width="360" height="130"/><rect class="head" x="720" y="780" width="360" height="55"/><text class="tiny" x="900" y="800" text-anchor="middle">«interface»</text><text class="h" x="900" y="825" text-anchor="middle">WaterPayment</text><text class="s" x="737" y="870">+ waterPayment()</text></g><g><rect class="node" x="1320" y="780" width="360" height="130"/><rect class="head" x="1320" y="780" width="360" height="55"/><text class="tiny" x="1500" y="800" text-anchor="middle">«interface»</text><text class="h" x="1500" y="825" text-anchor="middle">DinnerPayment</text><text class="s" x="1337" y="870">+ dinnerPayment()</text></g>
